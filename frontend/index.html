<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Primary Favicons & App Icons (Optimized for Google Search & Browsers) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#E11D74" />
    <meta name="format-detection" content="telephone=no" />

    <meta name="application-name" content="Rentu" />
    <meta name="apple-mobile-web-app-title" content="Rentu" />

    <!-- Google Search SEO Snippet -->
    <title>Rentu — Peer-to-Peer Rental Marketplace | Rent &amp; Lend Gear</title>
    <meta name="description" content="Rentu is the community platform to rent, lend, and borrow anything. Save money by renting cameras, electronics, tools, and creative gear, or earn cash by lending what you own." />
    <meta name="keywords" content="rent, lend, borrow, rentu, rent gear, rent cameras, rent electronics, peer to peer rental, local rental, gear sharing, camera rental nearby, electronics rental" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Rentu" />
    <meta name="rating" content="general" />
    <link rel="canonical" href="https://www.rentu.site/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:site_name" content="Rentu" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.rentu.site/" />
    <meta property="og:title" content="Rentu — Peer-to-Peer Rental Marketplace | Rent &amp; Lend Gear" />
    <meta property="og:description" content="Rentu is the community platform to rent, lend, and borrow anything. Save money by renting cameras, electronics, tools, and creative gear, or earn cash by lending what you own." />
    <meta property="og:image" content="https://www.rentu.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rentu — Rent, Lend, and Borrow Anything" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rentu" />
    <meta name="twitter:creator" content="@rentu" />
    <meta name="twitter:title" content="Rentu — Peer-to-Peer Rental Marketplace | Rent &amp; Lend Gear" />
    <meta name="twitter:description" content="Rentu is the community platform to rent, lend, and borrow anything. Save money by renting cameras, electronics, tools, and creative gear, or earn cash by lending what you own." />
    <meta name="twitter:image" content="https://www.rentu.site/og-image.png" />

    <!-- Google Schema.org Structured Data (WebSite + SearchAction + Organization + FAQPage) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.rentu.site/#website",
          "url": "https://www.rentu.site/",
          "name": "Rentu",
          "alternateName": ["Rentu.site", "Rentu Marketplace"],
          "description": "Rentu is the community peer-to-peer platform to rent, lend, and borrow anything locally.",
          "inLanguage": "en-US",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.rentu.site/?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.rentu.site/#organization",
          "name": "Rentu",
          "url": "https://www.rentu.site/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.rentu.site/icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://www.rentu.site/og-image.png",
          "sameAs": [
            "https://twitter.com/rentu",
            "https://www.instagram.com/rentu"
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://www.rentu.site/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does Rentu work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Rentu lets you browse and rent gear like cameras, electronics, and tools from verified locals in your neighborhood. You can also list items you own to earn passive income."
              }
            },
            {
              "@type": "Question",
              "name": "How is item handover verified?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every rental requires a secure 6-digit verification code exchanged in person between the borrower and owner to confirm item condition and protect both parties."
              }
            },
            {
              "@type": "Question",
              "name": "Is it free to list items on Rentu?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes! Listing items on Rentu is 100% free with no upfront fees. You set your daily rental price, security deposit, and pickup rules."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rentu-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(err) {
            console.warn('PWA Service Worker registration non-fatal error:', err);
          });
        });
      }
      window.addEventListener('beforeinstallprompt', function(e) {
        window.__pwaInstallPrompt = e;
      });
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased selection:bg-brand/20 selection:text-brand">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
